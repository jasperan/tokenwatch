[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tokenwatch"
version = "0.2.0"
description = "AI proxy with semantic caching, budget enforcement, and smart routing — powered by Oracle DB 26ai"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "httpx>=0.27",
    "oracledb>=2.0",
    "rich>=13.0",
    "click>=8.1",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# The test configuration below sets asyncio_mode = "auto", which requires
# pytest-asyncio; without it the async tests silently SKIP rather than run, so the
# suite appears to pass while 29 cases never execute. Neither pytest nor
# pytest-asyncio was declared anywhere, so a fresh clone could not run the
# documented suite at all.
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]
otel = [
    "opentelemetry-api>=1.20",
    "opentelemetry-sdk>=1.20",
    "opentelemetry-exporter-otlp-proto-grpc>=1.20",
]

[project.scripts]
tokenwatch = "tokenwatch.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tokenwatch = ["dashboard/*.html"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.uv]
